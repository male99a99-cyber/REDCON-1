name: Build Web to APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Create WebView Android Project Structure
      run: |
        # إنشاء هيكل مشروع أندرويد بسيط ومبسط يفتح صفحة الويب
        mkdir -p android-app/app/src/main/java/com/web/app
        mkdir -p android-app/app/src/main/res/layout
        mkdir -p android-app/app/src/main/res/values
        mkdir -p android-app/app/src/main/assets

        # نسخ ملفات الويب الخاصة بك إلى مجلد الـ Assets لكي تعمل داخل التطبيق محلياً
        # (أو يمكنك تعديل رابط WebView ليرتبط برابط استضافتك على Vercel أو GitHub Pages)
        cp -r *.html *.js *.css android-app/app/src/main/assets/ 2>/dev/null || true

        # إنشاء ملف AndroidManifest.xml
        cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.web.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="Web App"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # إنشاء ملف الجافا MainActivity.java لفتح الصفحة
        cat << 'EOF' > android-app/app/src/main/java/com/web/app/MainActivity.java
        package com.web.app;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView myWebView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                myWebView = new WebView(this);
                WebSettings webSettings = myWebView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                myWebView.setWebViewClient(new WebViewClient());
                
                // إذا كنت ترفع الملفات محلياً:
                myWebView.loadUrl("file:///android_asset/index.html");
                
                // أو إذا أردت ربطه مباشرة برابط موقعك على الإنترنت (استبدل الرابط برابطك):
                // myWebView.loadUrl("https://your-project.vercel.app");

                setContentView(myWebView);
            }
        }
        EOF

        # إعداد ملفات بناء Gradle الأساسية
        cd android-app
        echo "include(':app')" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.web.app'
            compileSdk 33
            defaultConfig {
                applicationId "com.web.app"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Build APK with Gradle
      run: |
        cd android-app
        chmod +x gradlew || gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: webview-app-debug
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
